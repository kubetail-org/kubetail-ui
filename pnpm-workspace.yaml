# Supply-chain policies, also checked against pnpm-lock.yaml on every frozen
# install. A release must be a week old before pnpm installs it, and a
# version published with weaker trust evidence than an earlier one is
# rejected.
#
# The week matches Dependabot's cooldown. A security fix that can't wait goes
# in minimumReleaseAgeExclude as an exact version.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# Backports to old majors, published in 2023 without the provenance that
# semver 7 had by then.
trustPolicyExclude:
  - semver@5.7.2
  - semver@6.3.1
allowBuilds:
  esbuild: true
  unrs-resolver: true
overrides:
  "@babel/core": ^7.29.6
  baseline-browser-mapping: ^2.11.0
  brace-expansion@1: ^1.1.21
  browserslist: ^4.28.7
  esbuild: ^0.28.1
  fast-uri: ^3.1.9
  flatted: ^3.4.2
  js-yaml: ^4.3.2
  lodash-es: ^4.18.0
  minimatch: ^3.1.3
  postcss: ^8.5.23
  picomatch: ^4.0.4
  rollup: ^4.59.0
  source-map-js: ^1.2.2
  typescript: ^6.0.2
  undici: ^7.30.1
  zod: ^4.6.6
