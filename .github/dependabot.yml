version: 2
updates:
  # Every action is pinned to a commit SHA; this moves the pins and the
  # version comments beside them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
