name: "Setup Environment"
description: "Sets up pnpm and Node.js, and optionally installs dependencies"

# Run after actions/checkout: the action is read from the checkout, and pnpm
# takes its version from package.json's packageManager field.
#
# setup-node's own cache is off: it saves in a post step on every ref, pull
# requests included. This action restores the pnpm store only when asked to,
# and saves it only when the caller says so; ci.yaml saves on main alone.
# A release passes neither, so it builds from no cache another job wrote.

inputs:
  node-version:
    description: "Node.js version to install"
    required: false
    default: "24"
  install:
    description: "Whether to run pnpm install --frozen-lockfile"
    required: false
    default: "false"
  node-cache:
    description: "Whether to restore the pnpm store before installing"
    required: false
    default: "false"
  cache-save:
    description: "Whether to save the pnpm store after installing"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - name: Find the pnpm store
      id: store
      if: inputs.install == 'true' && (inputs.node-cache == 'true' || inputs.cache-save == 'true')
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore the pnpm store
      id: restore
      if: inputs.install == 'true' && inputs.node-cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    # The key names the lockfile, so a hit already holds what this install
    # used, and saving it again would fail.
    - name: Save the pnpm store
      if: >-
        inputs.install == 'true' && inputs.cache-save == 'true'
        && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
