# zizmor configuration. CI's `YAML · Lint` job fails on any finding not ignored
# here.
rules:
  # Every action pinned to a commit SHA, first-party ones included.
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
  # Matches minimumReleaseAge in pnpm-workspace.yaml; a longer Dependabot
  # cooldown rolls back versions pnpm already accepted.
  dependabot-cooldown:
    config:
      days: 1
