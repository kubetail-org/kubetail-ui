name: Build and Publish Storybook to GitHub Pages

on:
  push:
    branches:
      - 'gh-pages'

# Each job declares what it needs, so a new one starts with nothing.
permissions: {}

# One deploy at a time, and a newer push waits for the one in flight rather
# than cancelling it partway.
concurrency:
  group: pages
  cancel-in-progress: false

# A deploy restores no GitHub Actions cache: ci.yaml saves the pnpm store on
# main, so code its jobs run could write one this build installs from. So no
# step here passes setup-environment node-cache.
jobs:
  # Dependency code runs here, so this job can't deploy to Pages.
  build:
    # GitHub starts push runs in forks too, and a fork has no Pages site of
    # ours, so this job, which the deploy needs, runs only in
    # kubetail-org/kubetail-ui.
    if: github.repository == 'kubetail-org/kubetail-ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          install: "true"
      - run: pnpm build-storybook
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
