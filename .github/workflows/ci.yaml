name: ci

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

permissions:
  contents: read

# A PR's new push cancels its last run. Every other run has a group of its own,
# so a run on main is never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Every TypeScript job restores the pnpm store, and only a run on main saves
  # it. A PR saving its own copy would only fill the repo's cache quota: no
  # other ref can read it.
  CACHE_SAVE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # GitHub starts push runs in forks too. Outside
  # kubetail-org/kubetail-ui this job runs only for a PR or a dispatch, and
  # every other job needs it, so a fork's automatic run skips whole.
  fork-gate:
    name: Fork gate
    if: >-
      github.repository == 'kubetail-org/kubetail-ui'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - run: "true"

  typescript-lint:
    name: TypeScript · Lint
    needs: fork-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          install: "true"
          node-cache: "true"
          cache-save: ${{ env.CACHE_SAVE }}
      - run: pnpm lint

  typescript-test:
    name: TypeScript · Test
    needs: fork-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          install: "true"
          node-cache: "true"
          cache-save: ${{ env.CACHE_SAVE }}
      - run: pnpm test

  typescript-build:
    name: TypeScript · Build
    needs: fork-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          install: "true"
          node-cache: "true"
          cache-save: ${{ env.CACHE_SAVE }}
      - run: pnpm build

  # Every tracked shell script, so a new one is checked without editing this.
  shell-lint:
    name: Shell · Lint
    needs: fork-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

  # yamllint checks every YAML file. actionlint type-checks the workflows and
  # shellchecks their `run:` blocks. zizmor audits them against
  # .github/ci-config/zizmor.yml.
  yaml-lint:
    name: YAML · Lint
    needs: fork-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - run: uv tool run yamllint@1.38.0 --strict .
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # The token turns on zizmor's online audits, which check each pin's
      # commit and version comment against the action's repository.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: uv tool run zizmor@1.31.1 --config .github/ci-config/zizmor.yml .
