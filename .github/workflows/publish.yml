name: publish

on:
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
        type: string
      dry_run:
        description: "Dry run"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  config:
    name: Configure workflow
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.config.outputs.version }}
      dry_run: ${{ steps.config.outputs.dry_run }}
    steps:
      - id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "dry_run=$INPUT_DRY_RUN" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
          fi

  publish:
    environment: production
    needs: config
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ needs.config.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ needs.config.outputs.version }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - run: pnpm install

      - run: pnpm build

      - run: /bin/bash set-version.sh "$VERSION"

      - name: Publish
        if: ${{ needs.config.outputs.dry_run == 'false' }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            pnpm publish --no-git-checks --access public --tag next
          else
            pnpm publish --no-git-checks --access public
          fi
