name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 1.2.3)"
        required: true
        type: string
      dry_run:
        description: "Dry run (builds the dispatched commit, publishes nothing)"
        required: false
        type: boolean
        default: true

# Each job declares what it needs, so a new one starts with nothing.
permissions: {}

# A release restores no GitHub Actions cache: ci.yaml saves the pnpm store on
# main, so code its jobs run could write one a release builds from. So no step
# here passes setup-environment node-cache.
jobs:
  config:
    name: Configure workflow
    # GitHub starts tag-push runs in forks too, and a fork has nothing to
    # publish, so this job, which every later job needs, runs only in
    # kubetail-org/kubetail-ui.
    if: github.repository == 'kubetail-org/kubetail-ui'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    outputs:
      version: ${{ steps.config.outputs.version }}
      ref: ${{ steps.config.outputs.ref }}
      dry_run: ${{ steps.config.outputs.dry_run }}
    steps:
      - id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            dry_run="$INPUT_DRY_RUN"
          else
            version="${GITHUB_REF#refs/tags/v}"
            dry_run=false
          fi
          # The version reaches set-version.sh's sed command, so reject
          # anything that isn't semver.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error::Version is not semver: $version"
            exit 1
          fi
          # dry_run gates the publish job, so anything else is rejected.
          case "$dry_run" in
            true|false) ;;
            *)
              echo "::error::dry_run is not true or false: $dry_run"
              exit 1
              ;;
          esac
          # A dry run publishes nothing, so it can build a commit with no tag
          # yet.
          if [ "$dry_run" == "true" ]; then
            ref="$GITHUB_SHA"
          else
            ref="refs/tags/v$version"
          fi
          {
            echo "version=$version"
            echo "ref=$ref"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"

  # Dependency code runs here, so this job can't mint an npm publish token.
  build:
    name: Build package
    needs: config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.config.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.config.outputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-environment
        with:
          install: "true"

      - run: pnpm build

      - run: /bin/bash set-version.sh "$VERSION"

      - run: pnpm pack --out "$RUNNER_TEMP/package.tgz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package.tgz
          if-no-files-found: error

  # Holds the npm publish token. It runs no repository or dependency code:
  # it publishes the tarball the build job packed, with npm so pnpm isn't
  # installed here either.
  publish:
    name: Publish package
    if: ${{ needs.config.outputs.dry_run == 'false' }}
    environment: production
    needs: [config, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.config.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: |
          if [[ "$VERSION" == *-* ]]; then
            npm publish "$RUNNER_TEMP/package.tgz" --access public --tag next
          else
            npm publish "$RUNNER_TEMP/package.tgz" --access public
          fi
